services:
  postgres:
    image: postgres:16-alpine
    container_name: activation-postgres
    environment:
      POSTGRES_DB: activation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: activation-service
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
